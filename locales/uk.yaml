---
language_name: '🇺🇦 Українська'
help: |
  <b>Hey! 👋</b>
  I will add <u>reactions</u> to your posts on the channel along with <u>native comments</u>. It's enough just to add me to your channel, give me permission to edit messages, and also add me to the group that is tied to the channel.

  • If you do not want me to change all messages or want to change emoji, then click the buttons below or send the command /channels to configure. <i>To display a channel in the list, you must first write any post.</i>

  <b>• Need help or have a suggestion?</b> Write to me: @Ly_OBot. Please write immediately what you are talking about and use English or Russian.

  🧑‍💻 Follow the developer: @LyBlog (Only in Russian)

  source: github.com/LyoSU/reacombot
menu:
  channels: '📣 Мої канали'
channels:
  select: |
    Оберіть канал:
  not_found: |
    <b>😞 Ви не додали бота до будь-якого з каналів</b>

    Якщо ви впевнені, що ви це зробили, спробуйте переконатися, що я маю дозвіл на редагування повідомлень і відправляти будь-які повідомлення на канал.
  updated: |
    Інформація про канал оновлена!
  control:
    info: |
      Канал обрано: <b>${channel.title}</b>

      • Що ви хочете змінити?
    menu:
      emoji: '${channel.settings.emojis} Emojis'
      type: '✍️ Коли додавати?'
      comments_type: '💬 Кнопка коментарів'
      links: '🔗 Клавіатура'
    no_available: |
      Канал більше не доступний.
    types:
      info: |
        <b>Виберіть, коли бот може додавати реакції до повідомлень:</b>

        • Завжди: реакції будуть додаватися до кожного повідомлення, коли це можливо
        • Одноразово: Реакції додаватимуться лише до одного нового повідомлення на каналі. Потім це налаштування зміниться на "ніколи", і вам потрібно буде змінити його тут ще раз
        • Ніколи: Бот ніколи не додаватиме реакцій на ваші повідомлення.
        • За запитом: Буде додано, коли останній рядок повідомлення починається з. символа ! а потім є смайли.
      menu:
        always: Завжди
        one: Одноразово
        never: Ніколи
        request: За запитом
    comments_types:
      info: |
        <b>Виберіть, де відображати коментарі:</b>

        • Завжди: кнопка коментаря завжди буде
        • Одноразово: лише наступна публікація матиме кнопку. Тоді це налаштування зміниться на "ніколи", і вам доведеться змінити його знову тут
        • Ніколи: не показувати кнопку коментаря
      menu:
        always: Завжди
        one: Одноразово
        never: Ніколи
    emojis:
      send_emoji: |
        <b>Надішліть один або кілька смайлів:</b>

        Поточні: <code>${channel.settings.emojis}</code>
        Один смайлик - одна кнопка
    links:
      send_links: |
        <b>Надіслати список клавіатури:</b>

        Приклад:
        <pre>Мій сайт - https://lyubchak.com/ | Telegram - https://telegram.org/
        Dev blog - https://t.me/LyBlog</pre>

        Надішліть будь-який текст для видалення.

        <i>Поточні кнопки відображатимуться нижче</i>
      success: Клавіатуру змінено!
  back: < Назад
rate:
  vote:
    rated: |
      Ви ${rateName} це
    back: |
      Ви повернули свою реакцію назад
    rated_limit: |
      ${reactList}

      Лічильники в повідомленні невдовзі будуть змінені.
wait: |
  🕒 Коментарі будуть розміщені найближчим часом...

  Якщо цього не відбувається довгий час, швидше за все, бота не додано до приєднаної групи.
error:
  cant_edited: |
    <b>😓 Помилка при додаванні реакції на <a href="${postLink}">повідомлення</a></b>

    Можливо у мене немає дозволу на редагування повідомлень.
